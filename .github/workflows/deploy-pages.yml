name: Deploy frontend to GitHub Pages

# Builds the React PWA and deploys it to GitHub Pages on every push to main
# that touches the frontend. The PHP API is NOT deployed here — it stays on
# your PHP server (KSWEB / XAMPP / shared hosting); point the app at it with
# the VITE_API_URL repository variable (Settings → Secrets and variables →
# Actions → Variables), e.g. https://your-server.com/api

on:
  push:
    branches: [main]
    paths: ['frontend/**', '.github/workflows/deploy-pages.yml']
  workflow_dispatch:

# Required for actions/deploy-pages
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; newer pushes cancel older queued runs
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build (project-page base path)
        working-directory: frontend
        # Base path must match the project Pages URL:
        # https://<user>.github.io/pharmacy-management-system/
        run: npx vite build --base=/pharmacy-management-system/
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      - name: SPA fallback for client-side routes
        working-directory: frontend
        run: cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
